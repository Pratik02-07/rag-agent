services:
  backend:
    build: null
    image: ${REGISTRY:-docker.io/your-dockerhub-username}/rag-backend:${IMAGE_TAG:-latest}
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      CHROMA_PATH: /app/chroma
      DATA_PATH: /app/data

  frontend:
    build: null
    image: ${REGISTRY:-docker.io/your-dockerhub-username}/rag-frontend:${IMAGE_TAG:-latest}
    environment:
      BACKEND_URL: http://backend:5000

  ollama:
    image: ollama/ollama:latest
