name: Security Scan & Push to Docker Hub

on:
  push:
    branches: ["main"]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tagname:
        description: "Docker image tag (e.g. 1.0.1, latest)"
        required: false
        default: ""

env:
  VERSION_PREFIX: "1.0"

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

  build-and-push:
    name: Build & Push to Docker Hub
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tagname }}" ]; then
            TAG="${{ github.event.inputs.tagname }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ env.VERSION_PREFIX }}.${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push rag-agent
        uses: docker/build-push-action@v6
        with:
          context: ./be-rag
          push: true
          tags: |
            docker.io/pratik0207/rag-agent:${{ steps.meta.outputs.tag }}
            docker.io/pratik0207/rag-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

